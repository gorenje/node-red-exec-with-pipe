<script type="text/javascript">
  (function(){
  RED.nodes.registerType('execWithPipe', {
    category: 'function',
    color: '#E9967A',
    icon: "font-awesome/fa-gears",
    defaults: {
      command: { value: "" },
      addpay: { value: "", validate: RED.validators.typedInput({ type: 'msg', allowBlank: true }) },
      addpayTo: { value: "parameter" },
      append: { value: "" },
      useSpawn: { value: "false" },
      timer: { value: "" },
      winHide: { value: false },
      oldrc: { value: false },
      name: { value: "" }
    },
    inputs: 1,
    outputs: 3,
    outputLabels: function (i) {
      return [
        this._("execwithpipe.label.stdout"),
        this._("execwithpipe.label.stderr"),
        this._("execwithpipe.label.retcode")
      ][i];
    },
    label: function () {
      return this.name || this.command.replace(/\\n /g, "\\\\n ") || (this.useSpawn == "true" ? this._("execwithpipe.spawn") : this._("execwithpipe.exec"));
    },
    labelStyle: function () {
      return this.name ? "node_label_italic" : "";
    },
    oneditprepare: function () {
      if ($("#node-input-useSpawn").val() === null) {
        $("#node-input-useSpawn").val(this.useSpawn.toString());
      }

      if ($("#node-input-addpayTo").val() === null) {
        $("#node-input-addpayTo").val(this.addpayTo.toString());
      }

      $("#node-input-addpay-cb").prop("checked", this.addpay === true || (this.addpay !== false && this.addpay !== ""))
      var addpayValue = (this.addpay === true) ? "payload" : ((this.addpay === false || this.addpay === "") ? "payload" : this.addpay);

      $("#node-input-addpay").val(addpayValue);
      $("#node-input-addpay").typedInput({
        default: "msg",
        types: ["msg"]
      });

      $("#node-input-addpay-cb").on("change", function (evt) {
        $("#node-input-addpay").typedInput("disable", !$("#node-input-addpay-cb").prop("checked"));
        $("#node-input-addpayTo").prop("disabled", !$("#node-input-addpay-cb").prop("checked"));
      });
      $("#node-input-addpay-cb").trigger("change")


      if (this.winHide === "true" || this.winHide === true) {
        $("#node-input-winHide").prop("checked", true);
      } else {
        $("#node-input-winHide").prop("checked", false);
      }
    },
    oneditsave: function () {
      if (!$("#node-input-addpay-cb").prop("checked")) {
        $("#node-input-addpay").val("");
      }
    }
  });  
})();

</script>

<script type="text/html" data-template-name="execWithPipe">
    <div class="form-row">
      <label for="node-input-command"><i class="fa fa-file"></i> <span data-i18n="execwithpipe.label.command"></span></label>
      <input type="text" id="node-input-command" data-i18n="[placeholder]execwithpipe.label.command">
    </div>

    <div class="form-row">
      <label><i class="fa fa-plus"></i> <span data-i18n="execwithpipe.label.append"></span></label>
      <input type="checkbox" id="node-input-addpay-cb" style="display:inline-block; width:auto;">
      <input type="text" id="node-input-addpay" style="margin-left: 5px; width:160px;">

      <span data-i18n="execwithpipe.label.as"></span>
      
      <select type="text" id="node-input-addpayTo" style="width:25%">
         <option value="parameter" data-i18n="execwithpipe.opt.parameter"></option>
         <option value="stdin" data-i18n="execwithpipe.opt.stdin"></option>
      </select>
    </div>

    <div class="form-row">
      <label for="node-input-append"> </label>
      <input type="text" id="node-input-append" data-i18n="[placeholder]execwithpipe.placeholder.extraparams">
    </div>

    <div class="form-row">
      <label><i class="fa fa-sign-out"></i> <span data-i18n="execwithpipe.label.return"></span></label>
      <select type="text" id="node-input-useSpawn" style="width:70%">
                <option value="false" data-i18n="execwithpipe.opt.exec"></option>
                <option value="true" data-i18n="execwithpipe.opt.spawn"></option>
      </select>
    </div>

    <div class="form-row">
      <label for="node-input-timer"><i class="fa fa-clock-o"></i> <span data-i18n="execwithpipe.label.timeout"></span></label>
      <input type="text" id="node-input-timer" style="width:65px;" data-i18n="[placeholder]execwithpipe.label.timeoutplace">
      <span data-i18n="execwithpipe.label.seconds"></span>
    </div>
    <div class="form-row">
      <label for="node-input-winHide" style="width: auto !important; padding-right:10px"><i class="fa fa-windows"></i> <span data-i18n="execwithpipe.label.winHide"></span></label>
      <input type="checkbox" id="node-input-winHide" style="margin-top: 0; display:inline-block; width:auto;">
    </div>
    <div class="form-row">
      <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="execwithpipe.label.name"></span></label>
      <input type="text" id="node-input-name" data-i18n="[placeholder]execwithpipe.label.name">
    </div>
</script>
